services:
  ruuvigw_mqtt_decode:
    build: .
    image: ghcr.io/oh2th/ruuvigw_mqtt_decode
    container_name: ruuvigw_mqtt_decode
    restart: unless-stopped
    # Host path /docker/ruuvigw_mqtt_decode/ is mounted as /config/ inside the
    # container. Change the host path to match your environment if needed.
    # Sample config files are copied there automatically on first start
    # if they do not already exist. Edit them on the host and restart the container.
    volumes:
      - /docker/ruuvigw_mqtt_decode:/config
    # Optional: add --debug flag to enable verbose logging
    # command: ["-config=/config/config.txt", "-tags=/config/known_tags.txt", "--debug"]
